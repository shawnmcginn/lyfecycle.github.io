<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding: 20px;">
    <!-- Contact Form -->
    <form style="flex: 1;" action="https://formspree.io/f/xpwpykna" method="POST" id="contact-form">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://lyfecycle.ca/">
        <input type="hidden" name="_subject" value="New contact form submission">
        <input type="hidden" name="_redirect" value="https://lyfecycle.ca/">
        <h3>Contact Us</h3>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" style="width: 100%; margin-bottom: 10px;" required><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" style="width: 100%; margin-bottom: 10px;" required><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" style="width: 100%; margin-bottom: 10px;" required></textarea><br>

        <div id="recaptcha-container"></div>
        <br>
        <button type="submit" style="padding: 10px 20px; background-color: #007BFF; color: white; border: none;">Send</button>
    </form>

    <!-- Add the reCAPTCHA script -->
    <script>
        // Check if we're in production or local
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        // Initialize reCAPTCHA only in production
        if (!isLocal) {
            // Load reCAPTCHA script
            const script = document.createElement('script');
            script.src = 'https://www.google.com/recaptcha/api.js?render=6Ld7UgorAAAAAIyFc5F5uXVgeEuZ2XCLA4XydqI4';
            script.async = true;
            script.defer = true;
            document.body.appendChild(script);

            // Initialize reCAPTCHA
            script.onload = function() {
                window.grecaptcha.ready(function() {
                    // Get token first
                    grecaptcha.execute('6Ld7UgorAAAAAIyFc5F5uXVgeEuZ2XCLA4XydqI4', {action: 'contact_form'})
                        .then(function(token) {
                            console.log('reCAPTCHA token generated:', token); // Debugging log
                            // Add the token to the form
                            var recaptchaResponse = document.createElement('input');
                            recaptchaResponse.type = 'hidden';
                            recaptchaResponse.name = 'g-recaptcha-response';
                            recaptchaResponse.value = token;
                            document.getElementById('contact-form').appendChild(recaptchaResponse);
                        });
                });
            };
        }
    </script>

    <!-- Contact Info -->
    <div style="flex: 1; text-align: right;">
        <h3>Lyfecycle Operations Inc.</h3>
        <div><strong>Address:</strong> 14 Galaxy Drive</div>
        <div><strong>City:</strong> Quispamsis, N.B.</div>
        <div><strong>Postal Code:</strong> E2G 2B4</div>
    </div>
</div>
