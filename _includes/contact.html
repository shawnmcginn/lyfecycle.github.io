<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding: 20px;">
    <!-- Contact Form -->
    <form style="flex: 1;" name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
        <!-- Hidden spam protection fields -->
        <input type="hidden" name="form-name" value="contact">
        <p class="hidden">
            <label>
                Don’t fill this out if you're human: <input name="bot-field" />
            </label>
        </p>
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://lyfecycle.ca/">
        <input type="hidden" name="_subject" value="New contact form submission">
        <input type="hidden" name="_redirect" value="https://lyfecycle.ca/">
        <h3>Contact Us</h3>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" style="width: 100%; margin-bottom: 10px;" required><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" style="width: 100%; margin-bottom: 10px;" required><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" style="width: 100%; margin-bottom: 10px;" required></textarea><br>

        <br>

        <button type="submit" style="padding: 10px 20px; background-color: #007BFF; color: white; border: none;">Send</button>

    </form>

    <script>
        // Success message handler
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('contact-form');
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const submitButton = form.querySelector('button[type="submit"]');
                submitButton.disabled = true;
                submitButton.textContent = 'Sending...';
                
                fetch('/', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' },
                    body: new FormData(form)
                })
                .then(() => {
                    submitButton.textContent = 'Sent!';
                    submitButton.style.backgroundColor = '#28a745';
                    setTimeout(() => {
                        form.reset();
                        submitButton.textContent = 'Send';
                        submitButton.style.backgroundColor = '#007bff';
                        submitButton.disabled = false;
                    }, 3000);
                })
                .catch(error => {
                    submitButton.textContent = 'Error';
                    submitButton.style.backgroundColor = '#dc3545';
                    setTimeout(() => {
                        submitButton.textContent = 'Send';
                        submitButton.style.backgroundColor = '#007bff';
                        submitButton.disabled = false;
                    }, 3000);
                });
            });
        });
    </script>

    <!-- Contact Info -->
    <div style="flex: 1; text-align: right;">
        <h3>Lyfecycle Operations Inc.</h3>
        <div><strong>Address:</strong> 14 Galaxy Drive</div>
        <div><strong>City:</strong> Quispamsis, N.B.</div>
        <div><strong>Postal Code:</strong> E2G 2B4</div>
    </div>
</div>
