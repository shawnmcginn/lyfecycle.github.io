<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding: 20px;">
        <!-- Contact Form -->
        <form style="flex: 1;" action="javascript:handleSubmit(event)" method="POST" id="contact-form">
            <h3>Contact Us</h3>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" style="width: 100%; margin-bottom: 10px;" required><br>
    
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" style="width: 100%; margin-bottom: 10px;" required><br>
    
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" style="width: 100%; margin-bottom: 10px;" required></textarea><br>
    
            <div id="recaptcha-container"></div>
            <br>
            <button type="submit" style="padding: 10px 20px; background-color: #007BFF; color: white; border: none;">Send</button>
        </form>
        
        <!-- Add the reCAPTCHA script -->
        <script>
            // Check if we're in production or local
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            
            if (!isLocal) {
                // Load reCAPTCHA only in production
                const script = document.createElement('script');
                script.src = 'https://www.google.com/recaptcha/api.js?render=6Ld7UgorAAAAAIyFc5F5uXVgeEuZ2XCLA4XydqI4';
                script.async = true;
                script.defer = true;
                document.body.appendChild(script);
            }

            // Handle form submission
            function handleSubmit(e) {
                e.preventDefault();
                
                if (!isLocal) {
                    // In production, ensure reCAPTCHA token is present
                    const recaptchaResponse = document.querySelector('input[name="g-recaptcha-response"]');
                    if (!recaptchaResponse || !recaptchaResponse.value) {
                        alert('Please complete the reCAPTCHA verification.');
                        return;
                    }
                }

                // Get form data
                const formData = new FormData(e.target);
                
                // Send to Formspree
                fetch('https://formspree.io/f/xpwpykna', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                })
                .then(response => {
                    if (response.ok) {
                        alert('Thank you for your message! We will get back to you soon.');
                        e.target.reset();
                    } else {
                        throw new Error('Form submission failed');
                    }
                })
                .catch(error => {
                    alert('Oops! Something went wrong. Please try again.');
                });
            }

            // Initialize form submission
            document.getElementById('contact-form').addEventListener('submit', handleSubmit);

            // Initialize reCAPTCHA only in production
            if (!isLocal) {
                window.grecaptcha.ready(function() {
                    grecaptcha.execute('6Ld7UgorAAAAAIyFc5F5uXVgeEuZ2XCLA4XydqI4', {action: 'contact_form'})
                        .then(function(token) {
                            // Add the token to the form
                            var recaptchaResponse = document.createElement('input');
                            recaptchaResponse.type = 'hidden';
                            recaptchaResponse.name = 'g-recaptcha-response';
                            recaptchaResponse.value = token;
                            document.getElementById('contact-form').appendChild(recaptchaResponse);
                        });
                });
            }
        </script>
   <!-- Contact Info -->

</div>
